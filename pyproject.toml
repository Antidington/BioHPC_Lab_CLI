[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhlab"
version = "0.1.0"
description = "A lightweight bioinformatics HPC lab CLI for portable kernels, benchmarks, and log-driven anomaly detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
bhlab = "bhlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bhlab = ["codegen_templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
